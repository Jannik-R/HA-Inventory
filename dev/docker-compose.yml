# Dev Home Assistant. Runtime data lives in dev/config/ (git-ignored).
# Start:  docker compose -f dev/docker-compose.yml up -d
# Tests:  docker compose -f dev/docker-compose.yml run --rm test [pytest args]
# Phone (HTTPS proxy on another host -> this PC:8124): docker compose -f dev/docker-compose.yml --profile proxy up -d
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    ports:
      # Localhost only: the dev HA skips the login for local requests (configuration.yaml).
      - "127.0.0.1:8123:8123"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../custom_components/home_inventory:/config/custom_components/home_inventory:ro
    # A USB receipt printer on this PC is reached through scripts/receipt_bridge.py (Docker Desktop's
    # WSL kernel has no USB printer driver): receipt printer = host.docker.internal:9100.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      default:
        ipv4_address: 10.123.45.2

  # Entry for an external HTTPS reverse proxy (phone camera needs HTTPS). Docker Desktop shows every
  # client as the gateway (a trusted network), so the client is set to a fixed untrusted address
  # (192.0.2.1, documentation range): requests through this port always need the HA login.
  proxy:
    image: caddy:2.11.7
    profiles: [proxy]
    command:
      ["caddy", "reverse-proxy", "--from", ":8124", "--to", "homeassistant:8123",
       "--header-up", "X-Forwarded-For: 192.0.2.1"]
    ports:
      - "8124:8124"
    networks:
      default:
        ipv4_address: 10.123.45.3

  # Same image as HA, so the Python version always matches.
  test:
    image: ghcr.io/home-assistant/home-assistant:2026.10.2
    profiles: [test]
    working_dir: /repo
    volumes:
      - ..:/repo
      - pip-cache:/root/.cache/pip
    entrypoint: ["sh", "-c", "pip install -q -r requirements_test.txt && pytest \"$@\"", "--"]
    command: ["-n", "8", "tests"]

# Fixed subnet: configuration.yaml trusts only its gateway (= requests from this PC).
networks:
  default:
    ipam:
      config:
        - subnet: 10.123.45.0/24
          gateway: 10.123.45.1

volumes:
  pip-cache:
