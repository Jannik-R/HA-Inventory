name: CI

# PRs run only what they touch; a manual run (Actions > CI > Run workflow) and the
# release skill run everything.
on:
  pull_request:
  workflow_dispatch:

# Read-only token: CI only checks, it never writes to the repo.
permissions:
  contents: read

# A newer push to the same PR/branch cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA (tag in the comment).
jobs:
  # Decides which jobs and test files a PR needs. Skipped jobs count as passed for the
  # required checks, so job names must stay as they are (no workflow-level paths filter).
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.diff.outputs.backend }}
      frontend: ${{ steps.diff.outputs.frontend }}
      full: ${{ steps.diff.outputs.full }}
      tests: ${{ steps.diff.outputs.tests }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          full=false backend=false frontend=false tests=
          # No base (manual run): everything.
          if [ -n "$BASE" ]; then files=$(git diff --name-only "$BASE" HEAD); else files=; full=true; fi
          has() { echo "$files" | grep -qE "$1"; }
          echo "$files" | grep -vE '^custom_components/home_inventory/www/' | grep -qE '^(custom_components/|tests/|requirements_test\.txt$|pyproject\.toml$)' && backend=true
          has '^(frontend/|custom_components/home_inventory/www/)' && frontend=true
          # Shared basics and the workflow itself: run the whole suite.
          has '^(\.github/workflows/|tests/conftest\.py$|requirements_test\.txt$|pyproject\.toml$|custom_components/home_inventory/(db\.py|migrations\.py|migration_.*|seed.*|manifest\.json)$)' && full=true
          # Test files: changed ones that still exist, plus tests/test_<module>.py per changed module.
          for f in $files; do
            case $f in
              tests/test_*.py) t=$f ;;
              custom_components/*.py) t=tests/test_$(basename "$f" .py).py ;;
              *) continue ;;
            esac
            [ -f "$t" ] && tests="$tests $t"
          done
          tests=$(printf '%s\n' $tests | sort -u | xargs)
          # Backend changed but no matching test file: run everything rather than nothing.
          [ "$backend" = true ] && [ -z "$tests" ] && full=true
          echo "backend=$backend frontend=$frontend full=$full tests=$tests"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "tests=$tests" >> "$GITHUB_OUTPUT"

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: home-assistant/actions/hassfest@cd6f3635a740c84d8a14f6121a90068b8ece6bf6 # master 2026-10

  hacs:
    # HACS fetches files unauthenticated, so it cannot validate a private repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration
          # Not published yet: no brands entry, repo description/topics are set when going public.
          ignore: brands description topics

  tests:
    needs: changes
    # A failed changes job must not skip the checks (skipped counts as passed): run them all then.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.backend == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # uv with a cached download instead of the HA container (pulling it took over a minute).
      # Keep python-version on the one the pinned HA release uses (its Docker image).
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.14"
          activate-environment: true
          enable-cache: true
          cache-dependency-glob: requirements_test.txt
      - run: uv pip install -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - env:
          FULL: ${{ needs.changes.outputs.full }}
          TESTS: ${{ needs.changes.outputs.tests }}
        run: |
          if [ "$FULL" = true ]; then pytest -q -n auto; else pytest -q -n auto $TESTS; fi

  frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.full == 'true') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run typecheck:e2e
      - run: npm run build
      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/home_inventory/www
