# Dev Home Assistant. Runtime data lives in dev/config/ (git-ignored).
# Start:  docker compose -f dev/docker-compose.yml up -d
# Tests:  docker compose -f dev/docker-compose.yml run --rm test [pytest args]
services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    ports:
      # Localhost only: the dev HA skips the login for local requests (configuration.yaml).
      - "127.0.0.1:8123:8123"
    environment:
      TZ: Europe/Berlin
    volumes:
      - ./config:/config
      - ./configuration.yaml:/config/configuration.yaml:ro
      - ../custom_components/pantry:/config/custom_components/pantry:ro

  # Same image as HA, so the Python version always matches.
  test:
    image: ghcr.io/home-assistant/home-assistant:stable
    profiles: [test]
    working_dir: /repo
    volumes:
      - ..:/repo
      - pip-cache:/root/.cache/pip
    entrypoint: ["sh", "-c", "pip install -q -r requirements_test.txt && pytest \"$@\"", "--"]
    command: ["tests"]

volumes:
  pip-cache:
