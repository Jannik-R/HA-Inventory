book_in:
  fields:
    code:
      required: true
      example: "4006040053026"
      selector:
        text:
    packages:
      default: 1
      selector:
        number:
          min: 1
          max: 9999
          mode: box
    expires_on:
      selector:
        date:
    location:
      example: Kühlschrank
      selector:
        text:
book_out:
  fields:
    code:
      required: true
      example: "4006040053026"
      selector:
        text:
    packages:
      default: 1
      selector:
        number:
          min: 1
          max: 9999
          mode: box
    location:
      example: Kühlschrank
      selector:
        text:
print_labels:
  fields:
    batch_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    count:
      default: 1
      selector:
        number:
          min: 1
          max: 20
          mode: box
print_shopping_list:
print_recipe:
  fields:
    recipe:
      required: true
      example: Lasagne
      selector:
        text:
    servings:
      selector:
        number:
          min: 1
          max: 99
          mode: box
plan_to_shopping_list:
  fields:
    start:
      selector:
        date:
    days:
      selector:
        number:
          min: 1
          max: 366
          mode: box
print_plan:
  fields:
    day:
      selector:
        date:
    period:
      default: day
      selector:
        select:
          translation_key: period
          options:
            - day
            - week
print_planned:
  fields:
    day:
      selector:
        date:
    meal:
      selector:
        select:
          translation_key: meal
          options:
            - breakfast
            - lunch
            - coffee
            - dinner
            - snack
shop_recipe:
  fields:
    recipe:
      required: true
      example: Lasagne
      selector:
        text:
    servings:
      selector:
        number:
          min: 1
          max: 99
          mode: box
plan_meal:
  fields:
    recipe:
      example: Lasagne
      selector:
        text:
    text:
      example: Pizza vom Lieferdienst
      selector:
        text:
    day:
      selector:
        date:
    meal:
      default: dinner
      selector:
        select:
          translation_key: meal
          options:
            - breakfast
            - lunch
            - coffee
            - dinner
            - snack
    servings:
      selector:
        number:
          min: 1
          max: 99
          mode: box
canning:
  fields:
    recipe:
      required: true
      example: Erdbeermarmelade
      selector:
        text:
    jars:
      selector:
        number:
          min: 1
          max: 9999
          mode: box
    made_on:
      selector:
        date:
    expires_on:
      selector:
        date:
    location:
      example: Keller
      selector:
        text:
    notes:
      selector:
        text:
          multiline: true
