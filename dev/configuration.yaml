default_config:

homeassistant:
  # Dev only: no login for requests from this machine (port is bound to 127.0.0.1 in
  # docker-compose.yml). Docker Desktop forwards them from its gateway, hence the private ranges.
  auth_providers:
    - type: trusted_networks
      trusted_networks:
        - 127.0.0.1
        - ::1
        - 172.16.0.0/12
        - 192.168.65.0/24
      allow_bypass_login: true
    - type: homeassistant

logger:
  default: info
  logs:
    custom_components.pantry: debug
