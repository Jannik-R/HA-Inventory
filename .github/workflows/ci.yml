name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # Not published yet: no brands entry, repo description/topics are set when going public.
          ignore: brands description topics

  tests:
    runs-on: ubuntu-latest
    # Same image as HA, so the Python version always matches.
    container: ghcr.io/home-assistant/home-assistant:stable
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements_test.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/pantry/www
