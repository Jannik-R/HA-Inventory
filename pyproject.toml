[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
# pyflakes, pycodestyle errors, import order, pyupgrade, bugbear, ruff's own checks
select = ["F", "E4", "E7", "E9", "I", "UP", "B", "RUF"]
# German UI text uses typographic dashes and the multiplication sign on purpose.
ignore = ["RUF001", "RUF002"]
