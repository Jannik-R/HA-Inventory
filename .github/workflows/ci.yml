name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@50baf3a307f87100cf550d4ae127746595030d5d # master 2026-10

  hacs:
    # HACS fetches files unauthenticated, so it cannot validate a private repo.
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@22.5.0
        with:
          category: integration
          # Not published yet: no brands entry, repo description/topics are set when going public.
          ignore: brands description topics

  tests:
    runs-on: ubuntu-latest
    # Same image as HA, so the Python version always matches (Dependabot does not bump this
    # tag; keep it on the HA version that requirements_test.txt pins).
    container: ghcr.io/home-assistant/home-assistant:2026.10.1
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements_test.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run i18n:check
      - run: npm run typecheck:e2e
      - run: npm run build
      - name: Committed bundle matches source
        run: git diff --exit-code -- ../custom_components/pantry/www
